<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI LLM CI/CD Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230d0d0d'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23ffaa00' font-family='monospace'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
</head>
<body>

<header>
  <h1>🚀 AI LLM CI/CD Dashboard</h1>
  <p class="tagline">GitHub Actions pipeline · Ollama AI review · Render backend</p>
</header>

<div class="search-bar">
  <input type="text" id="search" placeholder="Search commits, runs, reviews..." onkeyup="filterData()">
</div>

<section class="overview">
  <div class="stat" id="stat-repo"><span class="stat-label">Repo</span><span class="stat-value">—</span></div>
  <div class="stat" id="stat-score"><span class="stat-label">AI Score</span><span class="stat-value">—</span></div>
  <div class="stat" id="stat-last-build"><span class="stat-label">Last build</span><span class="stat-value">—</span></div>
  <div class="stat" id="stat-lines"><span class="stat-label">Code reviewed</span><span class="stat-value">—</span></div>
</section>

<div id="loading" class="loading">Loading project data...</div>

<section id="reviews" class="container"></section>
<section id="history" class="container"></section>
<section id="runs" class="container"></section>

<footer class="footer">
  <span id="source-note"></span>
</footer>

  <script src="app.js"></script>
</body>
</html>
